; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Subida: esta placa (CH9102) solo flashea en modo manual y sin stub.
; Al ver "Connecting....": mantener BOOT, pulsar EN, soltar BOOT.
upload_speed = 115200
board_upload.before_reset = no_reset
upload_flags =
    --no-stub
    --connect-attempts=0

; micro-ROS: la distro DEBE coincidir con la del agente en tu PC (humble, jazzy...)
board_microros_distro = humble
board_microros_transport = serial

lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio
    pololu/VL53L0X@^1.3.1
