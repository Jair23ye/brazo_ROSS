; Prueba del motor a pasos (NEMA 23 + DM556) SIN micro-ROS.
; Proyecto aparte: no toca el firmware principal del brazo.
;
; Compilar y subir (desde la carpeta del proyecto):
;   Windows: pio run -d pruebas/prueba_motor -t upload --upload-port COM5
;   Linux:   pio run -d pruebas/prueba_motor -t upload --upload-port /dev/ttyACM0
;   (al ver "Connecting....": mantener BOOT, pulsar EN, soltar BOOT)
; Monitor serie para mandar las teclas (con el agente de micro-ROS cerrado):
;   Windows: pio device monitor -d pruebas/prueba_motor -p COM5
;   Linux:   pio device monitor -d pruebas/prueba_motor -p /dev/ttyACM0

[env:prueba_motor]
; Misma version que el firmware principal: no descarga otra plataforma
platform = espressif32 @ 6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; Que abrir el monitor no deje la placa en reset ni en modo de descarga
monitor_rts = 0
monitor_dtr = 0

; Misma forma de subir que el firmware principal (esta placa CH9102 lo necesita)
upload_speed = 115200
board_upload.before_reset = no_reset
upload_flags =
    --no-stub
    --connect-attempts=0
